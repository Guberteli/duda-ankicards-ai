services:
  - type: web
    name: duda-ankicards-ai
    runtime: python
    plan: free
    buildCommand: "echo Build ready"
    startCommand: "python server.py"
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: PYTHON_VERSION
        value: 3.13.5
